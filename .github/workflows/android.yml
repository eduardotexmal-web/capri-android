name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # attaching the APK to a release, on tags only

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # the runner image already has the Android SDK (ANDROID_HOME); Gradle fetches any missing platform

      - uses: gradle/actions/setup-gradle@v4

      # her page's own code, the parts that run outside the browser too
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check the Android page scripts parse
        run: for f in app/src/main/assets/android/*.js app/src/main/assets/android/upstream/*.js; do node --check --input-type=module < "$f" || exit 1; done

      # a signing key from the repository's secrets, if there is one (same key = updates install over each other)
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.CAPRI_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/capri.jks"
          echo "CAPRI_KEYSTORE=$RUNNER_TEMP/capri.jks" >> "$GITHUB_ENV"

      - name: Build
        env:
          CAPRI_KEYSTORE_PASSWORD: ${{ secrets.CAPRI_KEYSTORE_PASSWORD }}
          CAPRI_KEY_ALIAS: ${{ secrets.CAPRI_KEY_ALIAS }}
          CAPRI_KEY_PASSWORD: ${{ secrets.CAPRI_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease lintRelease

      - name: Name the APK
        id: apk
        run: |
          v=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d'"' -f2)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/release/app-release.apk "Capri-Android-$v.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Capri-Android
          path: Capri-Android-*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-release.html
          if-no-files-found: ignore

      # every build of main is published as the release of its version (a direct download link)
      - name: Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apk.outputs.version }}
          name: Capri para Android ${{ steps.apk.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Descarga `Capri-Android-${{ steps.apk.outputs.version }}.apk` en tu teléfono e instálalo (permite instalar apps de esa fuente).
            Port no oficial de [capri-desktop](https://github.com/mochiiwuff/capri-desktop). Gratis, nunca a la venta (PolyForm Noncommercial 1.0.0).
          files: Capri-Android-*.apk
