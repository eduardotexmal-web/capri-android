name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # attaching the APK to a release, on tags only

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # her page's own code, the parts that run outside the browser too
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check the Android page scripts parse
        run: for f in app/src/main/assets/android/*.js app/src/main/assets/android/upstream/*.js; do node --check --input-type=module < "$f" || exit 1; done

      # a signing key from the repository's secrets, if there is one (same key = updates install over each other)
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.CAPRI_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/capri.jks"
          echo "CAPRI_KEYSTORE=$RUNNER_TEMP/capri.jks" >> "$GITHUB_ENV"

      - name: Build
        env:
          CAPRI_KEYSTORE_PASSWORD: ${{ secrets.CAPRI_KEYSTORE_PASSWORD }}
          CAPRI_KEY_ALIAS: ${{ secrets.CAPRI_KEY_ALIAS }}
          CAPRI_KEY_PASSWORD: ${{ secrets.CAPRI_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease lintRelease

      - name: Name the APK
        run: |
          v=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d'"' -f2)
          cp app/build/outputs/apk/release/app-release.apk "Capri-Android-$v.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Capri-Android
          path: Capri-Android-*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-release.html
          if-no-files-found: ignore

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Capri-Android-*.apk
